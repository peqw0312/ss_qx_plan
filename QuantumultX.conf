# ══════【第十二轮修改 2026-09-26】本地直连白名单 ══════
# 为什么写在这里：圈X 的匹配顺序是「本地规则 → 远程规则 → final」。
# 所以写在 [filter_local] 就能覆盖远程「全球加速」名单（ConnersHua Proxy.list）里的判断。
# 判定标准（重要）：
#   ✅ 该放这里 —— 国内有服务器/CDN、能直连的服务
#   ❌ 不要放  —— 真正被墙的服务（Google / GitHub / X / ChatGPT / YouTube …）
#
# ── A. 已确认被「全球加速」名单收进去、但国内其实可直连的（已启用）──
#    FT中文网
host-suffix, ftchinese.com, direct
#    FT中文网图片 CDN
host-suffix, ftimg.net, direct
#    彭博中文
host-suffix, bloomberg.cn, direct
#    Zoom（国内可直连；若导入后反而连不上，删掉这行即可）
host-suffix, zoom.us, direct
#

# ── C. 加密货币交易所 + 自带钱包（2026-09-26 第十五轮）──
# 与 A 段原因不同：这些域名本来就在「全球加速」GFW 名单里、本来是走代理的。
# 但这些 App 【自带代理功能】，流量由 App 自己的代理处理。
# 圈X 再代理一层 = 双重代理：更慢，且出口 IP 变成节点 IP（交易所对 IP 极敏感、易触发风控）。
# 所以这里显式交给「交易所」组，该组默认出口 = direct（= 圈X 不介入）。
#
# ⚠ 前提：App 内置代理要正常工作。若导入后某个站【反而打不开】：
#     · 不改文件的办法 —— 圈X 首页把「交易所」组切到任意节点，即变成走代理；
#     · 或删掉对应那一行。
#
#    Binance（币安）
host-suffix, binance.com, 交易所
host-suffix, binance.info, 交易所
host-suffix, bnbstatic.com, 交易所
