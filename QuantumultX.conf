# ══════【2026-09-26 第十八 / 十九轮】国产 AI · 输入法 · 语音引擎 · 直连白名单 ══════
# 起因：用户反馈「豆包竟然变卡了」，并问「是不是漏掉了国产 AI」。
# 答案：是漏了。但机制不是「国产 App 被送去代理」，而是下面这两条。
#
# ── 为什么国产 App 一般不用写规则 ──
#   final, direct 已经兜住「没被任何规则命中的流量」，国内 App 天然直连。
#   但豆包是个例外，有两处会咬到它 ——
#
#   ★ ① 唯一一条真正命中豆包的规则（真凶）★
#       远程「广告终结者」(Cats-Team/AdRules) 里有一行：
#           host-suffix, opt.doubao.com, reject
#       opt.* 是字节的 ABTest / 配置下发域名。豆包 App 启动时会请求它拿实验分组和功能开关。
#       被 reject 之后 App 拿不到配置：
#         · 有的实现直接用默认值            → 无感，看不出问题
#         · 有的实现会重试 + 等超时          → 启动慢、首页内容出得慢（= 你感觉到的「卡」）
#       圈X 的匹配顺序是「本地规则 → 远程规则 → final」—— 本地规则优先。
#       所以下面写一行  host-suffix, doubao.com, direct  就能把那条 reject 盖掉。
#       （纯埋点拦不拦无所谓；但 opt.* 兼作配置下发，宁可放它过。）
#
#   ② 远程「Ai-All-In-One」规则集里塞了一批【通用云域名】，整条被强制走美国节点：
#         amazonaws.com · cloudflare.com · googleapis.com · googleusercontent.com ·
#         azureedge.net · imgix.net · sentry.io · segment.io · statsigapi.net ·
#         featuregates.org · launchdarkly.com · algolia.net · auth0.com ·
#         intercom.io · intercomcdn.com · stripe.com · wp.com · identrust.com ·
#         arkoselabs.com
#       这些是「国外 AI 网站的前端依赖」（ChatGPT 登录要 auth0/arkoselabs、
#       文档搜索用 algolia、AB 用 statsig……），作者加它们是为了让 ChatGPT 页面能完整加载，
#       本身没错。代价是：任何其它 App 只要碰到这些域名，也会被拽去美国节点。
#       豆包不用这些（字节自研埋点 / 配置），所以风险不大 —— 但记在这里，方便以后排查。
#
# ── 下面这组是显式白名单 ──
#   A 段：字节系（含豆包）—— 真正解决问题的是第 1 行；其余是「钉死」，
#         防止将来远程规则变动把这些域名捞走。
#   B 段：其它国产 AI —— 纯保险。它们本来就会落到 final, direct，加了只是更稳
#         （冗余但无害；哪天想瘦身，整段删掉不影响任何功能）。
#   ⚠ 位置：写在 geoip, cn, direct【之前】—— 与 Soul 同理，避免被 IP 判断抢先。

