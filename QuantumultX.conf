[policy]

# 【2026-09-26 第十一轮修改】已删除「苹果服务」策略组（原为 static 手动组）
#   原行：static=苹果服务, direct, 香港节点, 台湾节点, 美国节点, 日本节点, 狮城节点, 韩国节点, 英国节点, 大马节点, proxy, img-url=...
#   理由：组里第一位本来就是 direct，而「苹果服务」规则集的出口已直接改成 direct（见 [filter_remote]），
#         这个组彻底没有人引用了 —— 纯冗余。
#   核查：全文搜过，无任何规则集或其他策略组的成员列表引用本组（全球加速 / 代理应用 / 兜底分流 都不含它）。
#   想恢复：把「原行」那行去掉行首「#  原行：」粘回本区域，并把规则集的 force-policy 改回「苹果服务」。
#   附注：第六轮说明里提到的「四个手动组」自本轮起为三个。
static=全球加速, 自动选择, direct, 香港节点, 台湾节点, 日本节点, 狮城节点, 美国节点, 韩国节点, 英国节点, 大马节点, 德国节点, 火鸡节点, proxy, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png
# 【2026-09-26 第五轮修改】已删除 3 个空转策略组：
#   哔哩哔哩 / 声田音乐 / 国际媒体
#   它们的规则集已在第三轮删除，已无任何引用（规则集、其他策略组均未引用）。
#   至此配置中已不存在任何 Spotify / 声田 相关条目。
#   想恢复：把对应组按原格式粘回本区域，再把规则集加回 [filter_remote] 即可。
# ↓↓↓ 新增：你点名的服务统一走这个组 ↓↓↓
static=代理应用, 自动选择, direct, 美国节点, 香港节点, 日本节点, 狮城节点, 台湾节点, 韩国节点, 英国节点, 大马节点, 德国节点, 火鸡节点, proxy, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
# ↑↑↑ 新增 ↑↑↑
# 注：final 已改为 direct，本组当前不参与分流；direct 提前到首位仅为语义正确，便于日后手动切回代理模式
static=兜底分流, direct, 自动选择, 全球加速, 香港节点, 台湾节点, 日本节点, 狮城节点, 美国节点, 韩国节点, 英国节点, 大马节点, 德国节点, 火鸡节点, proxy, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png

# ↓↓↓ 【2026-09-26 第十三轮新增】Soul 专用策略组 ↓↓↓
# 用途：Soul（灵魂社交）的 IP 属地由【出口 IP】决定，本组让它的流量走境外节点，
#       出口 IP 变成节点 IP → 属地显示为节点所在国家/地区。
# ⚠ 导入后请务必做这一步：在圈X 首页把本组手动指定成一个【固定节点】（不要用「自动选择」）。
#   原因：属地跟着出口走，节点换来换去属地也会跟着跳 —— 同一个账号的属地频繁跨国跳变，
#   本身就是风控的敏感特征。锁定一个节点 = 属地稳定。
#   如果只想让它落在某个国家，就选对应的地区组（日本节点 / 美国节点 …）。
# ⚠ 本组最后留了 direct 选项：想临时停用（让 Soul 回到直连）时，在首页切到 direct 即可，不用改文件。
static=Soul, 自动选择, 日本节点, 美国节点, 香港节点, 狮城节点, 韩国节点, 英国节点, 大马节点, 德国节点, 火鸡节点, 台湾节点, direct, proxy, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
# ↑↑↑ 新增 ↑↑↑

# ↓↓↓ 【2026-09-26 第十五轮新增】加密货币交易所 + 自带钱包 ↓↓↓
# 用途：币安 / OKX / Bybit / Bitget 及其自带钱包。这些 App 【自带代理功能】，
#       流量由 App 自己的代理处理 —— 圈X 再代理一层 = 双重代理：
#       ① 更慢（绕两跳）② 出口 IP 变成节点 IP，而交易所对 IP 极敏感、易触发风控。
# 默认出口 = direct（列表第一位）：圈X 不介入，交给 App 自己的代理。
# 若想改成走代理 → 在圈X 首页把本组切到任意节点即可，不用改文件。
static=交易所, direct, 香港节点, 日本节点, 美国节点, 狮城节点, 韩国节点, 英国节点, 大马节点, 德国节点, 火鸡节点, 台湾节点, proxy, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
# ↑↑↑ 新增 ↑↑↑

#默认设置15分钟测速一次，可自行修改check-interval=后面的数值（单位：秒），tolerance=后面的数值不建议修改
#将下面的url-latency-benchmark的内容替换成static，并删除[check-interval=1200, tolerance=0, ]即可手动选择节点
url-latency-benchmark=自动选择, server-tag-regex=^(?!.*(?:网易|墨鱼)).*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
url-latency-benchmark=香港节点, server-tag-regex=(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|美)).)*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png
url-latency-benchmark=台湾节点, server-tag-regex=(?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美)).)*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png
url-latency-benchmark=日本节点, server-tag-regex=(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png
url-latency-benchmark=狮城节点, server-tag-regex=(?=.*(新|狮|獅|SG|(?i)Singapore))^((?!(港|台|日|韩|美)).)*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png
url-latency-benchmark=美国节点, server-tag-regex=(?=.*(美|US|(?i)States|American))^((?!(港|台|日|韩|新)).)*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png
# ↓↓↓ 【2026-09-26 第六轮新增】韩国 / 英国 / 大马 三个地区测速组 ↓↓↓
# 说明：这三行不写排除段的 ^((?!(...)).)*$ ，原因见文件头 ⑧ 的「第六轮说明」。
#       作用 = 节点名里含下面关键词之一的，自动归入对应组。
url-latency-benchmark=韩国节点, server-tag-regex=(?=.*(韩|KR|(?i)Korea|(?i)Seoul)).*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/KR.png
url-latency-benchmark=英国节点, server-tag-regex=(?=.*(英|UK|(?i)Britain|(?i)England|(?i)London)).*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/UK.png
url-latency-benchmark=大马节点, server-tag-regex=(?=.*(马来|馬來|大马|大馬|MY|(?i)Malaysia|(?i)Kuala)).*$, check-interval=1200, tolerance=0, img-url=https://workbuddy-space-static.codebuddy.work/image/e5ub28taYyafoBlFf0jk9T.png
# ↑↑↑ 新增 ↑↑↑
# ↓↓↓ 【2026-09-26 第十七轮修改】大马节点图标：长方形 → 方版 ↓↓↓
# 原行（想换回去就把下面这行开头的「# 」去掉、替换上面那行）：
# url-latency-benchmark=大马节点, server-tag-regex=(?=.*(马来|馬來|大马|大馬|MY|(?i)Malaysia|(?i)Kuala)).*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Malaysia.png
#
# 为什么换：这不是「看着不像」，是量出来的硬差异 ——
#   港/台/日/新/美/韩/英/德/火鸡（Orz-3 那套）：108×108 画布，可见区域 106×106，满幅正方形
#   大马原来那版（Koolson/Qure）：144×144 画布，可见区域只有 142×102 —— 横长方形
#   圈X 的图标格是正方形的，按比例放进格子里：其它图标占满 98% 高，大马只有 71% 高。
#   所以它看着「小一号、扁一条」，这就是风格不统一的真因。
#
# 新图标哪来的：Orz-3 那套 300+ 个图标里【根本没有马来西亚】（查过它的 Color / Alpha 目录、
#   三个索引 JSON、以及全部 40 多个 fork），马来西亚国旗是 2:1 又带左上蓝底徽记，
#   原作者大概直接跳过了。所以这一枚是我按 Orz-3 的规格重画的：
#     · 轮廓：取它 8 个图标 alpha 通道的并集重建（严格对齐，外轮廓零偏差）
#     · 尺寸：108×108，可见区域与其它图标完全一致
#     · 光泽：Orz-3 那批图标带一层对角渐亮，按其土耳其图标拟合出的公式补上了
#   存址：放在你 WorkBuddy 资料库的图床里，是公网直链，长期有效（不是第三方免费图床）。
#
# 备选版（深蓝底 + 居中黄新月与 14 芒星，构图更像 Orz-3 那枚土耳其，小尺寸更清晰）：
#   想把上面 img-url= 后面的网址换成：https://workbuddy-space-static.codebuddy.work/image/HEwnx0vytoHErbpaQMBgWu.png
#   两版都是 108×108 方版，选哪个都行；本地原图也留了一份在工作区（大马图标-候选A/B-*.png）。
# ↑↑↑ 修改 ↑↑↑

# ↓↓↓ 【2026-09-26 第十七轮新增】德国 / 火鸡（土耳其）两个地区测速组 ↓↓↓
# 写法与上面三行完全一致：宽松匹配、不写排除段（原因见文件头「第六轮说明」）。
# 图标用的是 Orz-3/mini 那套「108×108 方版」—— 和香港/台湾/日本/狮城/美国/韩国/英国同源，
# 风格统一；德国 / 火鸡在这一套里都有现成图标，直接引用即可。
url-latency-benchmark=德国节点, server-tag-regex=(?=.*(德|DE|(?i)Germany|(?i)Frankfurt|(?i)Berlin)).*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/DE.png
url-latency-benchmark=火鸡节点, server-tag-regex=(?=.*(火鸡|土耳其|TR|(?i)Turkey|(?i)Istanbul)).*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/TR.png
# ⚠ 「TR」是土耳其的 ISO 国家代码，但它是纯大写两字母 —— 万一同一个节点名里还带
#   「TROJAN / TRIAL」这类大写英文，它也会被归进「火鸡节点」组（只是多一个可见的成员，
#   不会影响分流）。介意的话把节点名里那截改掉，或把这行里的 TR 去掉。
# ↑↑↑ 新增 ↑↑↑



