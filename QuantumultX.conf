#                     详见 [policy] 里大马节点那行上方的说明（含备选版网址）。
#   ⑰ [filter_local]  新增「国产 AI / 字节系 · 直连白名单」26 行（第十八轮）：
#                     起因：豆包变卡，你问「是不是漏掉了国产 AI」—— 确实漏了。
#                     真凶：远程「广告终结者」(Cats-Team/AdRules) 里有一行
#                           host-suffix,opt.doubao.com,reject
#                           —— opt.* 是字节的 ABTest / 配置下发域名，豆包启动时要请求它
#                           拿实验分组和功能开关；被 reject 后 App 可能重试等待
#                           → 启动 / 首页变慢（= 感觉到的「卡」）。
#                     修法：本地规则优先于远程规则，写 host-suffix, doubao.com, direct 即可盖掉。
#                     同时把字节系 13 个域名 + 其它国产 AI 13 个域名显式钉死 direct。
#                     → 本地规则 32 行增为 58 行
#     [general]        udp_drop_list 加了一段「可选开关」注释（第十八轮）：
#                      现值为 443, STUN, QUIC（丢弃 QUIC/HTTP3，是为提高去广告命中率）；
#                      若豆包 / 抖音仍然卡，可改成 STUN（放行 QUIC，代价是部分广告去不掉）。
#                      本条只加注释、未改实际值 —— 取舍要你点头。
#   ⑱ [filter_local]  修复「行尾注释」导致导入报错（第十八轮 · 补丁）：
#                     现象：导入后提示  未知策略或节点 "direct"
#                     原因：上面 ⑰ 新增的 26 行白名单，我把说明文字写在了规则行的【行尾】，
#                           形如：host-suffix, doubao.com, direct（空格若干）# 说明文字
#                           Quantumult X 的规则行【不支持行尾注释】—— 行尾那段
#                           "# 说明文字" 会被当成【策略名】的一部分，
#                           于是既报「未知策略」，那条规则本身也等于失效。
#                     修法：26 条说明全部移到对应规则的【上一行】，做成独立成行的 # 注释。
#                     佐证：原墨鱼配置全文 715 行，行尾注释数量为 0 —— 原因就在这里。
#                     ★ 以后改这份配置：注释一律独立成行，绝不要写在规则行尾。
#   ⑲ [filter_local]  扩展为「国产 AI · 输入法 · 语音引擎 · 直连白名单」（第十九轮）：
#                     起因：你说「豆包这种语音输入，开了代理会变慢；国产输入法
#                           （搜狗 / 讯飞 / 新版那些）的语音识别也依赖国内服务器，需要直连」。
#                     实测结论（逐条查过所有可能命中它们的规则）：
#                       · 「全球加速」(ConnersHua Proxy.list，497 条) 里【零】国产服务
#                       · 「Ai-All-In-One」(ddgksf2013 Ai.yaml) 里只有国外 AI
#                       → 所以输入法域名【本来就走直连】，不存在「被送去代理」这回事。
#                     但发现一个真实且【动态】的风险：
#                       · 远程「广告终结者」(AdRules) 里有 28 条 *.sogou.com 的 reject，
#                         外加 log.iflytek.com / dt.xfyun.cn / log.aispeech.com /
#                         analysis.chatglm.cn 等埋点 reject；
#                       · AdRules 是【每天更新】的 —— 今天拦统计，明天可能就误伤功能域。
#                     → 凡「功能域一旦被误伤就得重装 App」的服务，都值得显式钉死。
#                     本轮新增：
#                       · 字节语音域（openspeech.bytedance.com / speech.bytedance.com）——
#                         豆包的语音输入与语音通话走这两个，已被 bytedance.com 覆盖，补注释便于检索
#                       · 国产输入法：搜狗 / 讯飞 / 百度 / 手心 / QQ
#                       · 语音识别 API：讯飞 iat-api / ws-api、百度 vop / speech / voice
#                       · 其它国产语音引擎：思必驰 / 云知声 / 捷通华声
#                       · 国产 AI 补全 11 个域名（Kimi / 智谱 ChatGLM / 百川 / 秘塔 /
#                         天工 / 商汤 / 面壁 / 出门问问 / 零一万物 / 字节即梦）
#                     → 本地规则 58 行增为 90 行（A13 + B23 + C15 + D7 = 58 条是本轮区块，
#                       另 32 条为 Soul / 交易所 / threads / 白名单 / 内网 / final 等原有规则）
#                     ⚠ 取舍（重要）：搜狗我只写【精确功能域】，不写 host-suffix, sogou.com ——
#                       宽匹配会连带放行 26 条搜狗广告/统计/导航域，不如精确列划算。
#                       若你更在意「语音输入绝不出任何问题」，把 C 段那 5 行换成
#                       host-suffix, sogou.com, direct 一行即可（代价是会看到搜狗推广）。
#                     ⚠ 同时【故意不收】在境外托管的域名：moonshot.com（Kimi 国际版 ·
#                       Cloudflare）、pixverse.ai、klingai.com、minimax.io —— 写 direct 反而更慢。
#
#   ── 第六轮说明：为什么这 3 个新组没写排除段 ──
#   原作者给测速组写了互斥排除，形如  ^((?!(港|台|日|韩|新|美)).)*$
#   —— 意思是「节点名里不含这些字」，用来保证一个节点只落进一个地区组。
#   这 3 个新组我故意没写，因为排除段是「黑名单式」的，误伤是静默的：
#     举例：若照抄该写法，一条名为「新加坡-亚马逊专线」的节点会因名字含「马」
#     而被踢出「狮城节点」组，你只会发现节点莫名消失，不会有任何报错。
#   所以新组一律用宽松写法 (?=.*(关键词)).*$ ，宁可一个节点同时出现在两个组里
#   （可见、可自行分辨），也不静默丢节点。
#   同理，现有 5 个地区组的排除列表我也没有加「英 / 马」，避免触发上述误伤。
#   匹配关键词（节点名含任一即归组）：
#     韩国节点：韩 | KR | Korea | Seoul
#     英国节点：英 | UK | Britain | England | London
#     大马节点：马来 | 馬來 | 大马 | 大馬 | MY | Malaysia | Kuala
#     德国节点：德 | DE | Germany | Frankfurt | Berlin          （第十七轮新增）
#     火鸡节点：火鸡 | 土耳其 | TR | Turkey | Istanbul             （第十七轮新增）
#   ⚠ 若你的节点名是纯国旗 emoji（如 🇰🇷🇬🇧🇲🇾🇩🇪🇹🇷）或纯编号、不含上述文字，
#     这些组会匹配不到节点 —— 去圈X 里给节点改个名（加上地区字）即可。
#
#   注：⑤ 已使 ④ 的说明略微过时 —— 现在国内直连完全靠 final, direct，不再依赖 geoip / 国内网站
#                     原配置是"兜底走代理"的黑名单模式，国内流量只在 geoip, cn 与
#                     远程的「国内网站」(IP-ASN) 生效时才安全 —— 而这两道都是按 IP
#                     判断、都必须查 GeoLite2 数据库。数据库没配即双双失效，国内 App
#                     就一路掉到兜底 → 绕道出国 → 卡。
#                     改为 direct 后国内流量 100% 直连，不再依赖数据库。
#                     代价：被墙、但不在「全球加速」名单里的冷门国外站点会直连而
#                     打不开，遇到就加进「代理应用」组。
#
# 为什么没有给「Safari 浏览器」单独写规则：
#   圈X 只认域名，不认 App。让 Safari 走代理 = 让国外网站普遍走代理，
#   这件事由原有的「全球加速」规则集承担（保留未动）。
#   国内域名由 [filter_local] 的 final, direct 兜住直连 ——
#   （第十轮已删掉「国内网站」规则集，国内直连不再依赖 geoip / 国内网站 / GeoLite2）
#
# 需要注意：7 条新增规则集的位置在「广告终结者」之后 —— 顺序不能提前，
#   否则视频站的内嵌广告域名会被送去代理而不是被拦截。
# =====================================================================

[general]

# > 用于节点延迟测试
server_check_url= http://www.gstatic.com/generate_204
# > 服务器测试超时时间 (毫秒)
server_check_timeout = 3000
# > 用于设置图标显示
profile_img_url=https://github.githubassets.com/images/modules/site/integrators/google.png
# > 用于Check节点IP地址(以下geo_location_checker任选一个即可)
geo_location_checker=disabled
;geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js
# > 功能强大的解析器，用于引用资源的转换
resource_parser_url=https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
# > 下列路径将不经过QuanX的处理
excluded_routes=239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32
#udp_whitelist=1-442, 444-65535
# > 第一个filter为4g模式开启规则分流，第二个filter为其他wifi下开启规则分流，第三个wifi1修改成你路由器翻墙的wifi名开启直连模式，第四个wifi2为你公司或者其他有路由器翻墙的WiFi名走直连）
# > 默认关闭根据wifi切换模式，如需开启，删除下方的"#"即可
#running_mode_trigger=filter, filter, wifi1:all_direct, wifi2: all_direct
# > dns_exclusion_list
dns_exclusion_list=*.10099.com.cn, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn
# > udp_drop_list 可直接屏蔽 STUN、QUIC 等协议的数据包
# ──【2026-09-26 第十八轮 · 可选开关，未改动实际值】──────────────────
# 这一行会丢弃所有 UDP 443（= QUIC / HTTP3）。它是「豆包变卡」的第二嫌疑。
#   · 原作者为什么这么写：圈X 的 URL 重写抓不到 QUIC（QUIC 是加密的、不走 TCP），
#     不丢 QUIC 的话，很多 App 会偷偷用 HTTP/3 加载广告 → 去广告命中率大幅下降。
#   · 代价：字节系 App（豆包 / 抖音 / 番茄小说）是 QUIC 的重度用户，被丢之后要回退到 TCP，
#     首屏和弱网下可能变慢。目前无法按 App 区分，这行是全局的。
# ── 怎么选（二选一，改完要重新导入配置）──
#   想保持去广告强（现状，不动）        → udp_drop_list = 443, STUN, QUIC
#   想优先保证豆包 / 抖音流畅（牺牲部分去广告）→ udp_drop_list = STUN
# ──────────────────────────────────────────────────────────
udp_drop_list = 443, STUN, QUIC


