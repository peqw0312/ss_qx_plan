#           更慢，且出口 IP 变成节点 IP —— 交易所对 IP 极敏感，易触发风控。
#     ★ 默认出口 = direct（组内第一位）= 圈X 不介入，交给 App 自己的代理。
#     ⚠ 前提：App 内置代理要正常工作。若某站反而打不开 →
#        首页把本组切到任意节点（变成走代理），或删掉对应那一行。
#   ⑭ [rewrite_remote] 删除 1 条重写（第十六轮）：
#                     豆瓣网页观影快捷跳转@ddgksf2013（Html/Douban.conf）
#                     → 重写 10 条减为 9 条
#                     性质说明：它属于「网页优化」（在豆瓣电影页加播放入口），
