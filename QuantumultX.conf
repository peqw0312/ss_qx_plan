#     同时在本区留了一段【注释掉的模板】，说明国内 App 为什么不用写规则、要写该怎么写。
#     ⚠ 结论：国内银行 / 社交 / 金融 / 股票类 App 的域名【本来就不在】「全球加速」名单里，
#        它们天然掉到 final, direct —— 不需要为它们写任何规则（写了也是空转，不生效）。
