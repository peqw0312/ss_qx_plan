geoip, cn, direct

# > 【2026-09-26 第二轮修改】兜底由「兜底分流」改为 direct
# > 原配置兜底走代理（黑名单模式）。国内流量能不能直连，全靠上面那行 geoip, cn 和
# > 远程的「国内网站」(IP-ASN) —— 而这两道都是按 IP 判断、都必须查 GeoLite2 数据库。
# > 数据库没配 = 两道全失效 = 国内 App 一路掉到这里 → 绕道出国 → 卡（Soul 就是这么卡的）。
# > 改为 direct 后：国内流量 100% 直连，不再依赖任何数据库。
# > 代价：被墙、但不在「全球加速」名单里的冷门国外站点会直连因而打不开，遇到就加进「代理应用」组。
# > 想切回「兜底走代理」：把下面这行还原成 final, 兜底分流 即可。
final, direct



[http_backend]



