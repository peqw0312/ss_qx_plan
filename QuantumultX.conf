# ══════【2026-09-26 第十三轮修改】Soul 走代理（改变 IP 属地）══════
# 目的：Soul 的流量走「Soul」策略组 → 出口 IP 换成节点 IP → 属地显示为节点所在国家。
#
# ★ 位置是关键，不要把它挪到下面去：
#   必须写在 geoip, cn, direct 【之前】。因为 geoip 是「按 IP 判断」的，
#   而 Soul 的域名解析后多落在国内 CDN IP 上 —— geoip 会先把它们判成 direct，
#   写在它后面就永远轮不到这条规则。规则写了不生效，而且【不会报错】，只是静默失效。
#
# 为什么用 host-keyword 而不是逐条 host-suffix：
#   Soul 的接口分散在 api / api-h5 / im 等多个子域，用关键词一次全覆盖，更不容易漏。
# 已覆盖：api.soulapp.cn · api-h5.soulapp.cn · im.soulapp.cn · *.soulapp-inc.cn · *.soulsmile.cn
#
# 如果实测发现还有 soul 域名走了 direct（方法见交付说明），把域名发我补进来即可。
host-keyword, soulapp, Soul
host-keyword, soulsmile, Soul
